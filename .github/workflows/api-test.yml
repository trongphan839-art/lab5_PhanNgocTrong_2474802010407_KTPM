name: ReqRes API Automated Testing

on:
  push:
    branches: [ main ]

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout mã nguồn từ repository lên runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Thiết lập môi trường Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 3. Cài đặt Newman CLI và Newman HTML Extra Reporter toàn cục
      - name: Install Newman and HTML Extra Reporter
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      # 4. Thực thi tập lệnh kiểm thử tự động với Newman (không dùng users.csv)
      - name: Run Postman Collection via Newman
        run: |
          newman run 2474802010407_PhanNgocTrong_ReqRes.postman_collection.json \
            -e 2474802010407_PhanNgocTrong_ReqRes_Env.postman_environment.json \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export report.html

      # 5. Tải tệp báo cáo report.html lên làm Artifact của Workflow
      - name: Upload HTML Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: postman-html-report
          path: report.html
